{% extends "inventory/base.html" %}
{% block title %}Add Category{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <h3 class="fw-bold mb-3"><i class="bi bi-tags"></i> Add Category</h3>
    <div class="card card-stat p-4">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Category Name</label>
          {{ form.name }}
          {{ form.name.errors }}
        </div>
        <button type="submit" class="btn btn-amj"><i class="bi bi-check-lg"></i> Save</button>
        <a href="{% url 'inventory:product_add' %}" class="btn btn-outline-secondary">Back</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
